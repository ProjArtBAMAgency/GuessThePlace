  /users:
    get:
      tags:
        - Users
      summary: Retrieve all users - must be authenticated
      description: >
        Returns a list of users with optional pagination and team filtering.
        Use `pagination=true` to enable pagination with `page` and `limit` parameters (works with or without `teamId`).
        Use `teamId` to filter users by team (works with or without pagination).
        These parameters are independent: you can use pagination alone, filtering alone, both together, or neither.
      parameters:
        - name: pagination
          in: query
          description: "Enable pagination (set to 'true' to activate)."
          schema:
            type: string
            enum: ['true', 'false']
            example: 'true'
        - name: page
          in: query
          description: "Page number for pagination (default: 1). Only used when pagination=true."
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          description: "Maximum number of users to return per page (default: 10). Only used when pagination=true."
          schema:
            type: integer
            default: 10
            example: 20
        - name: teamId
          in: query
          description: "Filter users by team ID."
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: List of users retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Admin privileges required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Admin privileges required"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

    post:
      tags:
        - Users
      summary: Create a new user
      description: >
        Creates a new user with the provided details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pseudo:
                  type: string
                  description: "The user's pseudonym."
                  example: "player1234"
                email:
                  type: string
                  description: "The user's email address."
                  example: "player1234@example.com"
                password:
                  type: string
                  description: "The user's password."
                  example: "securePassword123!"
                team_id:
                  type: string  
                  description: "The ID of the team the user belongs to (MongoDB ObjectId)."
                  example: "507f1f77bcf86cd799439011"
                is_admin:
                  type: boolean
                  description: "Indicates if the user has admin privileges."
                  default: false
                  example: true
              required:
                - pseudo
                - email
                - password_hash
                - team_id
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User created successfully."
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request - Invalid data (invalid team ID, username must be between 6 and 10 characters, or invalid email format).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid team ID"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

