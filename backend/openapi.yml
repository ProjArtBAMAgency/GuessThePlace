openapi: 3.1.0

info:
  title: "GuessThePlace API"
  version: "1.0.0"
  description: >
    GuessThePlace API backend.
    Documented with OpenAPI/Swagger for the course.

servers:
  - url: http://localhost:3000/api/v1
    description: Serveur local (API v1)

tags:
  - name: Teams
    description: Routes related to teams
  - name: Zones
    description: Routes related to geographic zones
  - name: Posts
    description: Routes related to posts/publications
  - name: Guesses
    description: Routes related to location attempts (guesses)
  - name: Users
    description: Routes related to user management
  - name: Authentication
    description: Routes related to user authentication
  - name: Profile
    description: Routes related to user profiles

paths:
  /teams:
    get:
      tags:
        - Teams
      summary: Retrieve all teams
      description: Returns the complete list of teams.
      responses:
        "200":
          description: List of teams successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Teams
      summary: Create a new team - must be authenticated and admin
      description: >
        Creates a new team.
        The name is required and must be a non-empty string.
        The color is optional but, if provided, must be a string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Team name (required).
                  example: "Team Rocket"
                color:
                  type: string
                  description: Color associated with the team (optional).
                  example: "#FF5733"
              required:
                - name
      responses:
        "201":
          description: Team successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid data (missing name or wrong type, invalid color, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Admin privileges required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Admin privileges required"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams/{id}:
    get:
      tags:
        - Teams
      summary: Retrieve a team by its ID
      description: Returns a team using its unique identifier.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique team ID (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Team found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams/leaderboard:
    get:
      tags:
        - Teams
      summary: Retrieve the teams leaderboard
      description: Returns teams sorted by descending score.
      responses:
        "200":
          description: Teams leaderboard successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teams/possession:
    get:
      tags:
        - Teams
      summary: Retrieve team possession statistics
      description: >
        Returns statistics on the number of posts possessed by each team.
      responses:
        "200":
          description: Team possession statistics successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamPossession"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones:
    get:
      tags:
        - Zones
      summary: Retrieve all zones
      description: Returns the complete list of zones.
      responses:
        "200":
          description: List of zones successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones/{id}:
    get:
      tags:
        - Zones
      summary: Retrieve a zone by its ID
      description: >
        Returns a zone using its unique identifier.
        Returns a 400 error if the ID is not a valid ObjectId.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique zone ID (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Zone found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          description: Invalid ID (wrong format).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Zone not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error while retrieving the zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones/map:

    get:
      tags:
        - Zones
      summary: Retrieve all GeoJSON data for zones
      description: >
        Returns GeoJSON data for all zones.
      responses:
        "200":
          description: GeoJSON data for zones successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZonesGeoJSON"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # PARTIE SUR LES GUESS
  /guesses:
    get:
      tags:
        - Guesses
      summary: Retrieve all guesses - must be authenticated
      description: >
        Returns the complete list of guesses with pagination.
        Authentication is required to access this resource.
      parameters:
        - name: page
          in: query
          description: "Page number for pagination (default: 1)."
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          description: "Number of guesses to return per page (default: 20)."
          schema:
            type: integer
            default: 20
            example: 20
      responses:
        "200":
          description: List of guesses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guess"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Authentication required"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

    post:
      tags:
        - Guesses
      summary: Create a new guess (location attempt) - must be authenticated
      description: >
        Creates a new location attempt for a post.
        The distance between the guessed location and the true position is calculated,
        and a score is assigned based on that distance.
        Authentication is required to access this resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: ID of the user making the guess (MongoDB ObjectId).
                  example: "673a5e8f12c3b9f0a1234567"
                postId:
                  type: string
                  description: ID of the post being guessed (MongoDB ObjectId).
                  example: "673a5e8f12c3b9f0a1234567"
                guessedLat:
                  type: number
                  description: Latitude of the guessed position.
                  example: 46.5197
                guessedLon:
                  type: number
                  description: Longitude of the guessed position.
                  example: 6.6323
              required:
                - userId
                - postId
                - guessedLat
                - guessedLon
      responses:
        "201":
          description: Guess created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  guess:
                    $ref: "#/components/schemas/Guess"
                  distance:
                    type: number
                    description: Distance in meters between the guessed position and the true position.
                    example: 150
                  score:
                    type: number
                    description: Score assigned for this guess.
                    example: 985
        "400":
          description: Missing or invalid data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing or invalid data"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Authentication required"
        "404":
          description: Post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Post not found"
        "409":
          description: The user has already guessed this post before.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "The user has already guessed this post before"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

  /guesses/{id}:
    get:
      tags:
        - Guesses
      summary: Retrieve a specific guess - must be authenticated
      description: >
        Returns a guess by its unique identifier.
        Authentication is required to access this resource.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the guess (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Guess found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guess"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Authentication required"
        "404":
          description: Guess not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Guess not found"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

    delete:
      tags:
        - Guesses
      summary: Delete a guess - must be authenticated
      description: >
        Deletes an existing guess.
        Authentication is required to access this resource.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the guess (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Guess deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Guess deleted successfully"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Authentication required"
        "404":
          description: Guess not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Guess not found"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

  /guesses/user/{id}:
    get:
      tags:
        - Guesses
      summary: Retrieve all guesses of a user - must be authenticated
      description: >
        Returns all location attempts made by a specific user.
        Authentication is required to access this resource.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the user (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: User's guesses retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guess"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Authentication required"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

  /guesses/user/{id}/globalScore:
    get:
      tags:
        - Guesses
      summary: Retrieve a user's global score - must be authenticated
      description: >
        Calculates and returns the total score (sum of all scores) of a user.
        Authentication is required to access this resource.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the user (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: User's total score retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: ID of the user.
                    example: "673a5e8f12c3b9f0a1234567"
                  totalScore:
                    type: number
                    description: Total score of the user (sum of all their guesses).
                    example: 5420
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized - Authentication required"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"
      # END GUESSES SECTION

  /posts:
    get:
      tags:
        - Posts
      summary: Retrieve all posts - must be authenticated
      description: >
        Returns a list of posts with pagination support.
        Can filter posts by validation status.
        Requires authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: "Maximum number of posts to return (default: 40)."
          schema:
            type: integer
            default: 40
            example: 20
        - name: skip
          in: query
          description: "Number of posts to skip for pagination (default: 0)."
          schema:
            type: integer
            default: 0
            example: 0
        - name: isValidated
          in: query
          description: Filter posts by validation status.
          schema:
            type: boolean
            example: true
      responses:
        "200":
          description: List of posts retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Invalid token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid token"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

    post:
      tags:
        - Posts
      summary: Create a new post - must be authenticated
      description: >
        Creates a new post with an uploaded picture.
        The picture file must be included in the request as multipart/form-data.
        Requires authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                placeName:
                  type: string
                  description: Name or description of the place.
                  example: "Tour Eiffel"
                latitude:
                  type: number
                  description: Latitude coordinate of the post location.
                  example: 46.5197
                longitude:
                  type: number
                  description: Longitude coordinate of the post location.
                  example: 6.6323
                picture:
                  type: string
                  format: binary
                  description: Image file to upload (required).
              required:
                - latitude
                - longitude
                - picture
      responses:
        "201":
          description: Post created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Bad request - Missing picture or invalid coordinates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No picture uploaded"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Invalid token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid token"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Retrieve a post by ID - must be authenticated
      description: Returns a specific post based on its unique identifier. Requires authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the post (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Post found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Invalid token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid token"
        "404":
          description: Post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Post not found"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

    patch:
      tags:
        - Posts
      summary: Update a post - must be authenticated
      description: >
        Partially updates a post by its ID.
        Can update latitude, longitude, and validation status.
        Only admins can change the isValidated field.
        Requires authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the post (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  description: Updated latitude coordinate.
                  example: 46.5197
                longitude:
                  type: number
                  description: Updated longitude coordinate.
                  example: 6.6323
                isValidated:
                  type: boolean
                  description: Validation status of the post (admin only).
                  example: true
      responses:
        "200":
          description: Post updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Invalid token or insufficient privileges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid token"
        "404":
          description: Post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Post not found"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

    delete:
      tags:
        - Posts
      summary: Delete a post - must be authenticated and admin
      description: Deletes a post based on its unique identifier. Requires authentication and admin privileges.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the post (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "204":
          description: Post deleted successfully.
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Admin privileges required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Admin privileges required"
        "404":
          description: Post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Post not found"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

  /posts/{id}/picture:
    get:
      tags:
        - Posts
      summary: Retrieve a post's picture - must be authenticated
      description: Returns the image file associated with a post. Requires authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the post (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Picture retrieved successfully.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "403":
          description: Forbidden - Invalid token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid token"
        "404":
          description: Post not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Post not found"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

  /users/{id}/posts:
    get:
      tags:
        - Posts
      summary: Retrieve posts by user ID - must be authenticated
      description: >
        Returns all posts created by a specific user with pagination support.
        Can filter posts by validation status.
        Requires authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique ID of the user (MongoDB ObjectId).
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
        - name: limit
          in: query
