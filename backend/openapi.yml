      description: >
        Returns a paginated list of users ranked by their total score (sum of all guesses scores).
        Scores are sorted in descending order.
        Can optionally filter users by team.
      parameters:
        - name: page
          in: query
          description: "Page number for pagination (default: 1)."
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          description: "Maximum number of users to return per page (default: 10)."
          schema:
            type: integer
            default: 10
            example: 20
        - name: team_id
          in: query
          description: "Optional team ID to filter users by team (MongoDB ObjectId)."
          schema:
            type: string
            example: "673a5e8f12c3b9f0a1234567"
      responses:
        "200":
          description: Rankings retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: List of ranked users with their scores and ranking position.
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          description: Unique ID of the user (MongoDB ObjectId).
                          example: "673a5e8f12c3b9f0a1234567"
                        pseudo:
                          type: string
                          description: User's pseudonym.
                          example: "player123"
                        teamId:
                          type: string
                          description: ID of the user's team (MongoDB ObjectId).
                          example: "673a5e8f12c3b9f0a1234568"
                        team:
                          type: string
                          description: Name of the user's team.
                          example: "Team Blue"
                        totalScore:
                          type: number
                          description: Total accumulated score from all guesses.
                          example: 18500
                        ranking:
                          type: integer
                          description: Global ranking position (1-based, respecting pagination).
                          example: 1
                  pagination:
                    type: object
                    description: Pagination metadata.
                    properties:
                      page:
                        type: integer
                        description: Current page number.
                        example: 1
                      limit:
                        type: integer
                        description: Users per page.
                        example: 10
                      total:
                        type: integer
                        description: Total number of users (filtered by team if applicable).
                        example: 150
                      totalPages:
                        type: integer
                        description: Total number of pages.
                        example: 15
        "401":
          description: Unauthorized - Authentication required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Authentication required"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authentification JWT. Ajouter le token dans l'en-tête Authorization: Bearer <token>"

  schemas:
    Team:
      type: object
      properties:
        _id:
          type: string
          description: Unique team ID (MongoDB ObjectId).
          example: "673a5e8f12c3b9f0a1234567"
        name:
          type: string
          description: Team name.
          example: "Team Blue"
        color:
          type: string
          description: Color associated with the team.
          example: "#FF0000"
        possession:
          type: number
          description: Team score.
          example: 75667
      required:
        - name

    Zone:
      type: object
      description: Represents a geographic game zone.
      properties:
        _id:
          type: string
          description: Unique zone ID (MongoDB ObjectId).
          example: "673a5e8f12c3b9f0a1234567"
        name:
          type: string
          description: Zone name.
          example: "Lausanne Zone"
        description:
          type: string
          description: Zone description.
          example: "Zone covering downtown Lausanne."
      required:
        - name

    ZonesGeoJSON:
      type: object
      description: GeoJSON object representing a collection of zones (FeatureCollection).
      properties:
        type:
          type: string
          example: "FeatureCollection"
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: "Feature"
              geometry:
                type: object
                description: GeoJSON geometry (MultiPolygon).
                properties:
                  type:
                    type: string
                    example: "Polygon"
                  coordinates:
                    type: array
                    description: GeoJSON coordinates.
                    items:
                      type: array
                      items:
                        type: number
              properties:
                type: object
                description: Properties associated with the zone.
      required:
        - type
        - features
        # GUESS SCHEMAS
    Guess:
      type: object
      description: "Represents a user's location attempt (guess) for a post."
      properties:
        _id:
          type: string
          description: Unique ID of the guess (MongoDB ObjectId).
          example: "673a5e8f12c3b9f0a1234567"
        score:
          type: number
          description: Score assigned to this attempt (calculated based on distance).
          example: 985
        user:
          type: object
          description: Reference to the user who made the attempt.
          properties:
            _id:
              type: string
              description: ID of the user (MongoDB ObjectId).
              example: "673a5e8f12c3b9f0a1234567"
            pseudo:
              type: string
              description: The user's pseudonym.
              example: "player123"
        post:
          type: object
          description: Reference to the guessed post.
          properties:
            _id:
              type: string
              description: ID of the post (MongoDB ObjectId).
              example: "673a5e8f12c3b9f0a1234567"
            picture:
              type: string
              description: URL or path to the post's image.
              example: "/api/v1/posts/673a5e8f12c3b9f0a1234567/picture"
            latitude:
              type: number
              description: The post's actual latitude.
              example: 46.5197
            longitude:
              type: number
              description: The post's actual longitude.
              example: 6.6323
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the guess was created.
          example: "2024-12-10T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the guess was last updated.
          example: "2024-12-10T10:30:00.000Z"
      required:
        - score
        - user
        - post

        # END GUESS SCHEMAS

    Post:
      type: object
      description: Represents a post/publication with a picture and location.
      properties:
        _id:
          type: string
          description: Unique ID of the post (MongoDB ObjectId).
          example: "673a5e8f12c3b9f0a1234567"
        placeName:
          type: string
          description: Name or description of the place.
          example: "Tour Eiffel"
        latitude:
          type: number
          description: Latitude coordinate of the post location.
          example: 46.5197
        longitude:
          type: number
          description: Longitude coordinate of the post location.
          example: 6.6323
        isValidated:
          type: boolean
          description: Indicates whether the post has been validated by an administrator.
          example: false
        userId:
          type: string
          description: ID of the user who created the post (MongoDB ObjectId).
          example: "673a5e8f12c3b9f0a1234567"
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the post was created.
          example: "2024-12-10T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the post was last updated.
          example: "2024-12-10T10:30:00.000Z"
      required:
        - latitude
        - longitude
        - isValidated
    User:
      type: object
      description: "Represents a user in the system."
      properties:
        _id:
          type: string
          description: Unique ID of the user (MongoDB ObjectId).
          example: "673a5e8f12c3b9f0a1234567"
        pseudo:
          type: string
          description: The user's pseudonym.
          example: "player123"
        email:
          type: string
          description: The user's email address.
          example: "john@heig-vd.ch"
        team_id:
          type: string
          description: ID of the team the user belongs to (MongoDB ObjectId).
          example: "507f1f77bcf86cd799439011"
        is_admin:
          type: boolean
          description: Indicates if the user has admin privileges.
          example: false
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user was created.
          example: "2024-12-10T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user was last updated.
          example: "2024-12-10T10:30:00.000Z"
      required:
        - pseudo
        - email
        - team_id

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message.
          example: "Server error"